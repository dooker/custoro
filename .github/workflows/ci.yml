name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    api:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/api

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: apps/api/package-lock.json

            - name: Install dependencies
              run: npm ci

            # Check only - never --write / --fix in CI
            - name: Prettier
              run: npx prettier --check .

            - name: ESLint
              run: npx eslint .

            - name: Type-check
              run: npm run type-check

            - name: Build
              run: npm run build

    web:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/web

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: apps/web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Prettier
              run: npx prettier --check "src/**/*.{ts,tsx,css,md}"

            - name: ESLint
              run: npm run lint

            - name: Type-check
              run: npm run type-check

            - name: Build
              run: npm run build

    docker:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build production images
              run: docker compose -f docker-compose.prod.yml build
              env:
                  # Required by the compose file, not used at build time
                  DB_ROOT_PASSWORD: ci
                  DB_USERNAME: ci
                  DB_PASSWORD: ci
                  APP_ORIGIN: http://localhost
                  JWT_SECRET: ci

name: Audit

# Known vulnerabilities in the dependencies that ship in the production images (not the dev tools).
# It also runs weekly, because an advisory can appear without any change in this repository.
# A failure means "high" or "critical": update the package, or say here why it cannot be.
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

jobs:
    audit:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: [api, web]
        defaults:
            run:
                working-directory: apps/${{ matrix.app }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            # Reads package-lock.json, nothing is installed
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

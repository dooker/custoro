# Production deployment.
#
#   cp .env.production.example .env      # fill in secrets; never commit .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Exposes only the web container (nginx) on WEB_PORT; it serves the SPA and proxies /api to the API.
# Put a TLS-terminating proxy (e.g. Caddy) in front of it for HTTPS.
# Data lives in the `dbdata`, `uploads` and `invoices` volumes - back up all three.
name: custoro

services:
    db:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
            MYSQL_DATABASE: ${DB_NAME:-custoro}
            MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        volumes:
            - dbdata:/var/lib/mysql
            # Schema + seed for a fresh install (first start only)
            - ./apps/api/db:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 3s
            retries: 20

    api:
        image: ${API_IMAGE:-custoro-api:latest}
        build:
            context: ./apps/api
            target: prod
        restart: unless-stopped
        environment:
            NODE_ENV: production
            DB_HOST: db
            DB_PORT: 3306
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME:-custoro}
            APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
            JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
            EMAIL_HOST: ${EMAIL_HOST:-}
            EMAIL_PORT: ${EMAIL_PORT:-}
            EMAIL_USER: ${EMAIL_USER:-}
            EMAIL_PASS: ${EMAIL_PASS:-}
            EMAIL_FROM: ${EMAIL_FROM:-}
            SENTRY_DSN: ${SENTRY_DSN:-}
        volumes:
            - uploads:/app/uploads
            # Generated invoice PDFs, deliberately outside the statically served uploads/
            - invoices:/app/storage
        depends_on:
            db:
                condition: service_healthy

    web:
        image: ${WEB_IMAGE:-custoro-web:latest}
        build:
            context: ./apps/web
            target: prod
            args:
                VITE_API_ENDPOINT: /api
        restart: unless-stopped
        ports:
            - "${WEB_PORT:-80}:80"
        depends_on:
            api:
                condition: service_healthy

volumes:
    dbdata:
    uploads:
    invoices:

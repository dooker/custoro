# Headers for the app's own pages and assets, on top of security-headers.conf.
# The login token lives in localStorage, so the CSP is what stops injected script from reading
# it: scripts only from this origin, no inline script, no eval. Styles allow 'unsafe-inline'
# because the editor and some components set style attributes. blob: covers the PDF preview
# frame and image previews; Sentry needs connect-src and a blob: worker for replays.
# frame-ancestors is 'self' rather than 'none' because blob documents inherit this policy and
# the invoice PDF preview frames one inside the app.
include /etc/nginx/snippets/security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.sentry.io; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Headers for every response. Included in each location: nginx drops server-level add_header
# lines in any location that sets its own, so they are repeated per location on purpose.
# HSTS is only sent over HTTPS ($hsts is empty otherwise, and nginx skips empty headers).
add_header Strict-Transport-Security $hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

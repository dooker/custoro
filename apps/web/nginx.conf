# Production web server: serves the built SPA and proxies /api/* to the API container.
# TLS is expected to be terminated in front of this (Caddy, Traefik, a load balancer, ...).

# Keep the original scheme when running behind a TLS-terminating proxy
map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS only when the visitor came over HTTPS (see nginx/security-headers.conf)
map $origin_scheme $hsts {
    https   "max-age=31536000";
    default "";
}

# Reset links (/restore/<token>) and public invoice links (/pdf/<hash>, /api/pdf/<hash>) work for
# whoever has them, so the access log keeps them with that part hidden: in the request and in the
# Referer, which carries the page's address on the API calls the reset and PDF pages make.
# Two layers, because the raw request is logged and the app also answers its variants: the path
# rule ignores case and extra slashes (/RESTORE/, //pdf/), and any run of 32 or more hex digits
# is hidden wherever it stands, which is what both credentials are (a PDF hash 32, a reset token
# 64), so /api/%70df/<hash> loses it too. Left: a credential that is itself percent-encoded, which
# only someone who already has it can send.
map $request_uri $log_request_path {
    "~*^(?<log_path>/+(?:api/+)?(?:restore|pdf)/+)[^/?#]+(?<log_rest>.*)$" "${log_path}[hidden]${log_rest}";
    default $request_uri;
}

map $log_request_path $log_request_uri {
    "~*^(?<log_before>.*?)[0-9a-f]{32,}(?<log_after>.*)$" "${log_before}[hidden]${log_after}";
    default $log_request_path;
}

map $http_referer $log_referer_path {
    "~*^(?<ref_path>[^?#]*?/+(?:api/+)?(?:restore|pdf)/+)[^/?#]+(?<ref_rest>.*)$" "${ref_path}[hidden]${ref_rest}";
    ""      "-";
    default $http_referer;
}

map $log_referer_path $log_referer {
    "~*^(?<ref_before>.*?)[0-9a-f]{32,}(?<ref_after>.*)$" "${ref_before}[hidden]${ref_after}";
    default $log_referer_path;
}

# nginx's own "combined" format with the two above
log_format custoro '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $log_request_uri $server_protocol" $status $body_bytes_sent '
                   '"$log_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # Standard output in the official image, so `docker compose logs web` shows it
    access_log /var/log/nginx/access.log custoro;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Avatar / logo uploads
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Trailing slash strips the /api prefix: /api/customers -> http://api:3999/customers
        proxy_pass http://api:3999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;

        # The API sets its own CSP where it serves files (uploads); no app CSP here, so the
        # browser's PDF viewer keeps working for invoice PDFs
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fingerprinted build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/app-headers.conf;
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html
    location / {
        # index.html names the fingerprinted files of one build, and the unfingerprinted ones here
        # (locales, CHANGELOG.md) change with it: the browser asks the server each time (a 304
        # when nothing changed) instead of guessing from Last-Modified how long it may keep them
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/app-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

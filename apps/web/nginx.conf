# Production web server: serves the built SPA and proxies /api/* to the API container.
# TLS is expected to be terminated in front of this (Caddy, Traefik, a load balancer, ...).

# Keep the original scheme when running behind a TLS-terminating proxy
map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Avatar / logo uploads
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Trailing slash strips the /api prefix: /api/customers -> http://api:3999/customers
        proxy_pass http://api:3999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        # The API selects the tenant database from the Origin header, and browsers
        # omit Origin on same-origin GET requests, so always send the site's origin.
        proxy_set_header Origin $origin_scheme://$host;
    }

    # Fingerprinted build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
